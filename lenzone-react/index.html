    <title>LENZONE 2026</title>
    <!-- Vercel Web Analytics (plain-HTML setup, vercel.com/docs/analytics/quickstart): cookie-free,
         aggregate page views, visible only in the Vercel project dashboard. The site's tabs live in
         the URL hash ("/#playoffs"), which analytics would otherwise lump together as "/", so
         beforeSend rewrites the hash into the path ("/playoffs") and drops any "?week=N". Only
         collects on the deployed site once Web Analytics is enabled for the project. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      window.va('beforeSend', function (event) {
        try {
          var url = new URL(event.url);
          var tab = url.hash.slice(1).split('?')[0];
          if (tab) { url.pathname = '/' + tab; url.hash = ''; url.search = ''; }
          return Object.assign({}, event, { url: url.toString() });
        } catch (e) {
          return event;
        }
      });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
