<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
  <!-- Daytime "Mission Beach": a pastel Pacific with layered waves and foam, a wooden roller
       coaster in the style of Belmont Park's Giant Dipper, a lifeguard tower, palms, and surfboards
       planted in the sand. Pastel Miami Vice tones, San Diego setting. Decorative, not to scale. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD9D6"/>
      <stop offset="1" stop-color="#3FB4B8"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E3C4" stop-opacity="0"/>
      <stop offset="1" stop-color="#E9D2A8"/>
    </linearGradient>
    <g id="palm">
      <path d="M0 0 Q-8 -60 12 -112" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path d="M12 -112 q-30 -8 -52 14 q24 -26 52 -14 z M12 -112 q-14 -26 -46 -30 q34 2 46 30 z M12 -112 q10 -28 42 -34 q-30 10 -42 34 z M12 -112 q30 -2 50 20 q-24 -18 -50 -20 z M12 -112 q4 20 -8 40 q16 -20 8 -40 z"/>
    </g>
  </defs>

  <!-- Ocean band with three wave layers and foam crests -->
  <path d="M0 170 Q 100 158 200 170 T 400 170 T 600 170 T 800 170 T 1000 170 T 1200 170 T 1400 170 T 1600 170 V 240 H 0 Z" fill="url(#sea)" opacity="0.75"/>
  <path d="M0 190 Q 80 178 160 190 T 320 190 T 480 190 T 640 190 T 800 190 T 960 190 T 1120 190 T 1280 190 T 1440 190 T 1600 190 V 250 H 0 Z" fill="#5CC6C4" opacity="0.65"/>
  <path d="M0 212 Q 60 202 120 212 T 240 212 T 360 212 T 480 212 T 600 212 T 720 212 T 840 212 T 960 212 T 1080 212 T 1200 212 T 1320 212 T 1440 212 T 1560 212 T 1680 212" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M0 192 Q 80 180 160 192 T 320 192 T 480 192 T 640 192 T 800 192 T 960 192 T 1120 192 T 1280 192 T 1440 192 T 1600 192" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <rect x="0" y="214" width="1600" height="90" fill="url(#shore)"/>

  <!-- Giant Dipper-style wooden coaster (left) -->
  <g fill="none" stroke="#E7849E" stroke-linecap="round" opacity="0.85">
    <path d="M60 210 C 90 120, 120 120, 150 170 S 210 90, 250 150 S 310 140, 340 210" stroke-width="4"/>
    <g stroke-width="1.6" opacity="0.8">
      <line x1="80" y1="210" x2="80" y2="160"/><line x1="100" y1="210" x2="100" y2="133"/><line x1="120" y1="210" x2="120" y2="128"/>
      <line x1="140" y1="210" x2="140" y2="155"/><line x1="160" y1="210" x2="160" y2="166"/><line x1="180" y1="210" x2="180" y2="134"/>
      <line x1="200" y1="210" x2="200" y2="112"/><line x1="220" y1="210" x2="220" y2="108"/><line x1="240" y1="210" x2="240" y2="132"/>
      <line x1="260" y1="210" x2="260" y2="158"/><line x1="280" y1="210" x2="280" y2="160"/><line x1="300" y1="210" x2="300" y2="160"/><line x1="320" y1="210" x2="320" y2="182"/>
      <path d="M80 185 L100 160 L120 185 L140 160 L160 185 L180 160 L200 185 L220 160 L240 185 L260 175 L280 190 L300 175 L320 195"/>
    </g>
  </g>

  <!-- Lifeguard tower -->
  <g transform="translate(980 150)">
    <g stroke="#B9886A" stroke-width="4" stroke-linecap="round">
      <line x1="8" y1="40" x2="0" y2="90"/><line x1="62" y1="40" x2="70" y2="90"/>
      <line x1="20" y1="40" x2="16" y2="90"/><line x1="50" y1="40" x2="54" y2="90"/>
    </g>
    <rect x="0" y="12" width="70" height="30" rx="4" fill="#F7A9C0"/>
    <rect x="10" y="18" width="22" height="14" rx="2" fill="#BFF0EE"/>
    <rect x="38" y="18" width="22" height="14" rx="2" fill="#BFF0EE"/>
    <path d="M-6 14 L35 -6 L76 14 Z" fill="#3FB4B8"/>
    <line x1="35" y1="-6" x2="35" y2="-30" stroke="#8A6A55" stroke-width="2.5"/>
    <path d="M35 -30 L56 -24 L35 -18 Z" fill="#E4573D"/>
    <path d="M-10 54 L36 64" stroke="#B9886A" stroke-width="4"/>
  </g>

  <!-- Surfboards planted in the sand -->
  <g>
    <ellipse cx="1110" cy="226" rx="9" ry="44" fill="#F7A9C0" transform="rotate(-8 1110 226)"/>
    <ellipse cx="1132" cy="230" rx="9" ry="40" fill="#8FD9D6" transform="rotate(6 1132 230)"/>
    <ellipse cx="1153" cy="232" rx="8" ry="36" fill="#F3C969" transform="rotate(-3 1153 232)"/>
  </g>

  <!-- Palms -->
  <g fill="#2FA9B3" stroke="#1F8C94" stroke-width="1">
    <use href="#palm" transform="translate(1300 262) scale(1.25)"/>
    <use href="#palm" transform="translate(470 262) scale(1.05) scale(-1 1)"/>
  </g>
  <g fill="#E7849E" stroke="#C9637E" stroke-width="1">
    <use href="#palm" transform="translate(1420 266) scale(1.5)"/>
    <use href="#palm" transform="translate(1530 262) scale(1.1) scale(-1 1)"/>
  </g>
  <g stroke="#8A6A55" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M1300 262 Q1290 187 1315 122" stroke-width="7"/>
    <path d="M1420 266 Q1408 176 1438 98" stroke-width="8"/>
    <path d="M1530 262 Q1539 196 1517 139" stroke-width="7"/>
    <path d="M470 262 Q478 199 457 145" stroke-width="7"/>
  </g>
</svg>
